name: CI & CDK Deploy

on:
  workflow_dispatch: # manual trigger via GitHub UI
  push:
    branches:
      - main
      - release
      - develop
      - 'feature/**'
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'cdk.json'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run ci:lint

      - name: Run Unit Tests Suite
        run: npm run ci:test

      - name: Run Bundling code to minified assets
        run: npm run ci:build

  deploy:
    name: CDK Deploy (dev)
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: DEV

    env:
      APP_ENV: dev # your bin uses env/stage=dev
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Bundling code to minified assets
        run: npm run ci:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff
        run: |
          npx cdk diff --all \
            -c env=${APP_ENV} \
            -c stage=${APP_ENV} \
            -c region=${AWS_REGION}

      - name: CDK Synth
        run: |
          npx cdk synth --all \
            -c env=${APP_ENV} \
            -c stage=${APP_ENV} \
            -c region=${AWS_REGION}

      - name: CDK Deploy
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            -c env=${APP_ENV} \
            -c stage=${APP_ENV} \
            -c region=${AWS_REGION}

      - name: Show CDK Outputs
        run: cat cdk-outputs.json
